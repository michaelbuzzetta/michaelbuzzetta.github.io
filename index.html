<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Christmas Gift</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./public/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <h1 class="site-title">Christmas Gift</h1>
      <nav class="site-nav">
        <a href="./index.html" class="nav-link">Home</a>
        <a href="./gallery.html" class="nav-link">Gallery</a>
        <button id="unlock-full-gallery-btn" class="nav-link nav-button" type="button">
          Click If You Want to Ruin the Fun
        </button>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <section id="home-view" class="view">
      <div class="card card-centered">
        <h2>Welcome</h2>
        <p class="lead">
          Answer questions, earn rewards, and reveal hidden photos and videos in the gallery.
        </p>
        <div class="button-row">
          <button id="home-enter-game" class="btn btn-primary">Enter Game</button>
          <a href="./gallery.html" class="btn btn-secondary">View Gallery</a>
        </div>
      </div>
    </section>

    <section id="settings-view" class="view hidden">
      <div class="card card-centered">
        <h2>Game Settings</h2>

        <div class="form-row">
          <label for="num-questions">Number of questions</label>
          <input id="num-questions" type="number" min="1" max="25" value="5">
        </div>

        <div class="form-row">
          <span>Difficulty</span>
          <div class="difficulty-row">
            <button data-difficulty="easy" class="difficulty-btn selected">Easy</button>
            <button data-difficulty="medium" class="difficulty-btn">Medium</button>
            <button data-difficulty="hard" class="difficulty-btn">Hard</button>
          </div>
        </div>

        <div class="form-row">
          <label for="category-select">Category (optional)</label>
          <select id="category-select">
            <option value="any">Any category</option>
            <option value="Personal">Personal</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
            <option value="Art">Art</option>
            <option value="Gerography">Geography</option>
          </select>
        </div>

        <div class="button-row">
          <button id="settings-start" class="btn btn-primary">Start Game</button>
          <button id="settings-cancel" class="btn btn-text">Back</button>
        </div>
      </div>
    </section>

    <section id="game-view" class="view hidden">
      <div class="card game-card">
        <div class="game-header">
          <button id="game-exit" class="btn btn-text small">⟵ Back</button>
          <div class="game-progress" id="game-progress"></div>
        </div>

        <div id="game-question-container">
          <h2 id="game-question-text"></h2>
          <ul id="game-options" class="options-list"></ul>
        </div>

        <div id="game-feedback" class="game-feedback"></div>

        <div id="game-summary" class="game-summary hidden">
          <h2>Game Over</h2>
          <p id="game-summary-text"></p>
          <div class="button-row">
            <button id="game-play-again" class="btn btn-primary">Play Again</button>
            <a href="./gallery.html" class="btn btn-secondary">View Gallery</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="unlock-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2>Unlock Full Gallery</h2>
        <button id="unlock-modal-close" class="btn btn-text" type="button">✕</button>
      </div>

      <p class="lead">Enter the password to unlock everything.</p>

      <div class="form-row">
        <label for="unlock-password">Password</label>
        <input id="unlock-password" type="password" autocomplete="off" />
      </div>

      <div id="unlock-error" class="form-error hidden"></div>

      <div class="button-row">
        <button id="unlock-submit" class="btn btn-primary" type="button">Unlock</button>
        <button id="unlock-cancel" class="btn btn-secondary" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initHome } from "./pages/home.js";
    import { initSettings } from "./pages/settings.js";
    import { initGamePage } from "./pages/game.js";

    initHome();
    initSettings();
    initGamePage();
  </script>

  <script type="module">
    import { unlockAllMedia } from "./routes/gallery.js";

    const FULL_GALLERY_PASSWORD = "CHANGE_ME";

    const openBtn = document.getElementById("unlock-full-gallery-btn");
    const modal = document.getElementById("unlock-modal");
    const closeBtn = document.getElementById("unlock-modal-close");
    const cancelBtn = document.getElementById("unlock-cancel");
    const submitBtn = document.getElementById("unlock-submit");
    const input = document.getElementById("unlock-password");
    const error = document.getElementById("unlock-error");

    if (openBtn && modal && closeBtn && cancelBtn && submitBtn && input && error) {
      const showError = (msg) => {
        error.textContent = msg;
        error.classList.remove("hidden");
      };

      const clearError = () => {
        error.textContent = "";
        error.classList.add("hidden");
      };

      const openModal = () => {
        clearError();
        input.value = "";
        modal.classList.remove("hidden");
        document.body.classList.add("no-scroll");
        setTimeout(() => input.focus(), 0);
      };

      const closeModal = () => {
        modal.classList.add("hidden");
        document.body.classList.remove("no-scroll");
        clearError();
        input.value = "";
      };

      openBtn.addEventListener("click", openModal);
      closeBtn.addEventListener("click", closeModal);
      cancelBtn.addEventListener("click", closeModal);

      modal.addEventListener("click", (e) => {
        if (e.target === modal || e.target.classList.contains("modal-backdrop")) {
          closeModal();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.classList.contains("hidden")) closeModal();
        if (e.key === "Enter" && !modal.classList.contains("hidden")) submitBtn.click();
      });

      submitBtn.addEventListener("click", () => {
        clearError();
        const attempt = input.value;

        if (!attempt) {
          showError("Please enter a password.");
          return;
        }

        if (attempt !== FULL_GALLERY_PASSWORD) {
          showError("Incorrect password. Try again.");
          return;
        }

        unlockAllMedia();
        closeModal();
        alert("Full gallery unlocked!");
      });
    }
  </script>
</body>
</html>
